task: enhancement
seed: 42
device: auto
data:
  train_images: data/enhancement/train/input
  train_targets: data/enhancement/train/target
  val_images: data/enhancement/val/input
  val_targets: data/enhancement/val/target
model:
  name: residual_enhancer
  image_size: [512, 512]
  channels: 32
train:
  epochs: 50
  batch_size: 4
  workers: 0
  lr: 0.0001
  weight_decay: 0.0001
  output_dir: weights/enhancement
